# P6 dien tap deploy (KHONG phai ha tang that): Postgres + API + worker + Nginx dung dung deploy/nginx/3dsmood.conf, NODE_ENV=production.
# Chay bang deploy/rehearsal/rehearse.sh (no sinh bi mat + chung chi tu ky vao deploy/rehearsal/.state, khong commit).
name: rehearsal3d
x-app: &app
  build: { context: ../.., dockerfile: deploy/rehearsal/Dockerfile }
  env_file: .state/store.env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0              # trong container; chi Nginx toi duoc (khong publish cong)
    PORT: "4000"
    TRUST_PROXY: 172.28.0.0/16 # tren VPS Nginx cung may nen la 127.0.0.1; o day Nginx la container khac trong mang nay
    STORAGE_DIR: /var/lib/3dsmood
  volumes: [ "data:/var/lib/3dsmood" ]
  depends_on: { postgres: { condition: service_healthy } }
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: store, POSTGRES_DB: store }
    env_file: .state/pg.env
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U store -d store"], interval: 2s, timeout: 3s, retries: 30 }
    networks: [ net ]
  api:
    <<: *app
    command: ["node", "src/server.js"]
    networks: [ net ]
    mem_limit: 900m   # giong MemoryMax=900M cua unit systemd
  worker:
    <<: *app
    command: ["node", "src/worker.js"]
    networks: [ net ]
    mem_limit: 900m
  nginx:
    image: nginx:stable
    depends_on: [ api ]
    ports: [ "127.0.0.1:8443:443" ]
    volumes:
      - ../nginx/3dsmood.conf:/tpl/3dsmood.conf:ro
      - .state/tls:/etc/letsencrypt/live/api.example.com:ro
      - data:/var/lib/3dsmood:ro
    # Chi doi dia chi upstream; moi thu khac la file cau hinh that.
    command: ["sh", "-c", "sed 's#127.0.0.1:4000#api:4000#' /tpl/3dsmood.conf > /etc/nginx/conf.d/default.conf && mkdir -p /var/www/3dsmood /var/www/certbot && echo '<html>admin</html>' > /var/www/3dsmood/index.html && exec nginx -g 'daemon off;'"]
    networks: [ net ]
volumes: { data: {}, pgdata: {} }
networks: { net: { ipam: { config: [ { subnet: 172.28.0.0/16 } ] } } }
