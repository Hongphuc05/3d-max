# P6.1 (plan §P6): Nginx truoc store-api. Doi api.example.com + duong dan chung chi + thu muc du lieu cho khop VPS.
# Quy uoc: ung dung /opt/3dsmood, du lieu /var/lib/3dsmood (STORAGE_DIR), admin web build o /var/www/3dsmood.
# store-api chi nghe 127.0.0.1:4000 (HOST/PORT) va PHAI dat TRUST_PROXY=127.0.0.1 de gioi han theo IP khong gom het client ve IP cua Nginx.

limit_conn_zone $binary_remote_addr zone=dl_per_ip:10m;
limit_req_zone  $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

upstream store_api { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Cu phap `listen ... http2` chay duoc ca nginx 1.24 (Ubuntu 24.04); `http2 on;` can >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Body API nho (express.json gioi han 10 kB); khong co upload lon.
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ngoai quy trinh: webhook R2 cu chi danh cho he thong cu, khong mo ra Internet.
    location /internal/ { return 404; }

    # Anh preview ten = sha256 noi dung -> bat bien, phuc vu thang tu dia voi cache dai; khong co file thi nhuong cho API.
    location ~ "^/previews/(?<preview>[0-9a-f]{64}\.webp)$" {
        alias /var/lib/3dsmood/previews-v3/$preview;
        default_type image/webp;
        # add_header trong location lam MAT cac add_header cap server -> lap lai HSTS o day.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        error_page 404 = @api;
    }

    # Moi duong dan /previews/ khac (anh cu) van do API xu ly, khong roi vao trang admin.
    location /previews/ { proxy_pass http://store_api; }

    # Tai model (stream tu VPS): toi da 2 ket noi dong thoi moi IP, khong dem trong Nginx, cho toi 30 phut.
    location /api/v1/model-downloads/ {
        limit_conn dl_per_ip 2;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://store_api;
    }

    # SSE cap nhat catalog: khong dem, giu ket noi lau.
    location = /api/v1/catalog/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://store_api;
    }

    # D29: admin tai anh preview (<= 15 MB/anh, express.raw gioi han lai o API); chi route nay duoc nhan body lon.
    location = /api/admin/previews {
        client_max_body_size 16m;
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://store_api;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://store_api;
    }

    location @api { proxy_pass http://store_api; }

    # Goi cai dat thu vien (mzp) do workflow release.yml dua len; thu muc rieng vi deploy.yml rsync --delete xoa sach /var/www/3dsmood.
    location /download/ {
        alias /var/www/3dsmood-download/;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment; filename=\"3dsmood-library.mzp\"" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Trang admin (vite build -> /var/www/3dsmood). Plugin dung ban dong goi san, khong tai trang nay.
    location / {
        root /var/www/3dsmood;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
