<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Platform — Design Library</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 14px system-ui, "Segoe UI", sans-serif; margin: 0; padding: 16px;
         background: #232323; color: #ddd; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 18px; margin: 0; }
  #host { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #444; }
  #host.live { background: #1d5c2e; color: #cfc; }
  #host.dead { background: #6b2020; color: #fcc; }
  #stats { font-size: 12px; color: #999; margin-bottom: 14px; }
  #stats button, .tools button { font: inherit; font-size: 12px; padding: 2px 8px;
         background: #3a3a3a; color: #ddd; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #stats button:hover, .tools button:hover { background: #4a4a4a; }
  #grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: #2c2c2c; border: 1px solid #3d3d3d; border-radius: 6px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .row label { font-size: 12px; color: #aaa; }
  .row input[type=number] { width: 70px; background: #1e1e1e; color: #ddd;
         border: 1px solid #4a4a4a; border-radius: 3px; padding: 3px 6px; font: inherit; }
  .row input[type=color] { width: 40px; height: 24px; background: none; border: 1px solid #4a4a4a; padding: 0; }
  .add { width: 100%; margin-top: 8px; padding: 7px; font: inherit; cursor: pointer;
         background: #2f6d3f; color: #fff; border: none; border-radius: 4px; }
  .add:hover { background: #3a8750; }
  .add:disabled { background: #444; color: #888; cursor: not-allowed; }
  .tools { margin: 18px 0 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 12px; color: #999; }
  #log { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; margin-top: 6px;
         padding: 8px; height: 200px; overflow: auto; white-space: pre-wrap;
         font: 11px/1.5 Consolas, monospace; }
  .err { color: #f88; } .ok { color: #8d8; } .evt { color: #8cf; } .out { color: #888; }
</style>
</head>
<body>

<header>
  <h1>Design Library</h1>
  <span id="host">đang kiểm tra…</span>
</header>
<div id="stats">
  <span id="statsText">—</span>
  <button id="refresh">Làm mới</button>
</div>

<div id="grid"></div>

<div class="tools">
  <button data-method="host.ping">host.ping</button>
  <button data-method="host.getInfo">host.getInfo</button>
  <button data-method="scene.getInfo">scene.getInfo</button>
  <button data-method="scene.getSelection">scene.getSelection</button>
  <button data-method="scene.createBox">scene.createBox</button>
  <button id="clear">Xoá log</button>
</div>

<details open>
  <summary>Bridge log</summary>
  <div id="log"></div>
</details>

<script>
// ---- catalog: preset parametric, dựng từ primitive ngay trong MAXScript, không cần asset file ----
const DESIGNS = [
  { id: 'desk',  name: 'Bàn làm việc', color: '#9c6b3f',
    fields: [['width','Rộng',140], ['depth','Sâu',70], ['height','Cao',75]] },
  { id: 'chair', name: 'Ghế',          color: '#3f6f9c',
    fields: [['width','Rộng',45], ['depth','Sâu',45], ['height','Cao',90]] },
  { id: 'shelf', name: 'Kệ sách',      color: '#8a8a72',
    fields: [['width','Rộng',90], ['depth','Sâu',30], ['height','Cao',180], ['shelves','Số tầng',4]] },
  { id: 'sofa',  name: 'Sofa',         color: '#7a4b6b',
    fields: [['width','Rộng',180], ['depth','Sâu',85], ['height','Cao',75]] }
];

const webview = window.chrome && window.chrome.webview;
const pending = new Map();
const TIMEOUT_MS = 10000;

function log(text, cls) {
  const line = document.createElement('div');
  line.className = cls || '';
  line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  const box = document.getElementById('log');
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function request(method, params = {}) {
  if (!webview) {
    return Promise.resolve({ ok: false, error: { code: 'HOST_NOT_READY', message: 'Không chạy trong 3ds Max' } });
  }
  const id = crypto.randomUUID();
  return new Promise(resolve => {
    const timer = setTimeout(() => {
      pending.delete(id);
      resolve({ id, ok: false, error: { code: 'TIMEOUT', message: `Không có hồi đáp sau ${TIMEOUT_MS}ms` } });
    }, TIMEOUT_MS);
    pending.set(id, { resolve, timer });
    log('→ ' + method + ' ' + JSON.stringify(params), 'out');
    webview.postMessage({ id, version: 1, method, params });
  });
}

if (webview) {
  webview.addEventListener('message', e => {
    let msg = e.data;
    if (typeof msg === 'string') {
      try { msg = JSON.parse(msg); } catch { return log('← JSON hỏng: ' + msg, 'err'); }
    }
    if (!msg || typeof msg !== 'object') return log('← message không hợp lệ', 'err');
    if (msg.event) return log('⚡ ' + JSON.stringify(msg), 'evt');
    const p = pending.get(msg.id);
    if (!p) return log('← không khớp request nào: ' + JSON.stringify(msg), 'err');
    clearTimeout(p.timer);
    pending.delete(msg.id);
    p.resolve(msg);
  });
}

const hostEl = document.getElementById('host');
hostEl.textContent = webview ? '3ds Max (WebView2)' : 'Trình duyệt — không có host';
hostEl.className = webview ? 'live' : 'dead';

// ---- render catalog ----
const grid = document.getElementById('grid');
for (const d of DESIGNS) {
  const card = document.createElement('div');
  card.className = 'card';

  const h = document.createElement('h2');
  h.textContent = d.name;
  card.appendChild(h);

  const inputs = {};
  for (const [key, label, value] of d.fields) {
    const row = document.createElement('div');
    row.className = 'row';
    const l = document.createElement('label');
    l.textContent = label;
    const i = document.createElement('input');
    i.type = 'number'; i.value = value; i.min = 1; i.step = 1;
    inputs[key] = i;
    row.appendChild(l); row.appendChild(i);
    card.appendChild(row);
  }

  const crow = document.createElement('div');
  crow.className = 'row';
  const cl = document.createElement('label');
  cl.textContent = 'Màu';
  const ci = document.createElement('input');
  ci.type = 'color'; ci.value = d.color;
  crow.appendChild(cl); crow.appendChild(ci);
  card.appendChild(crow);

  const btn = document.createElement('button');
  btn.className = 'add';
  btn.textContent = 'Thêm vào scene';
  btn.onclick = async () => {
    const params = { type: d.id };
    for (const key in inputs) {
      const n = Number(inputs[key].value);
      if (!Number.isFinite(n) || n <= 0) return log(`Giá trị "${key}" không hợp lệ`, 'err');
      params[key] = n;
    }
    params.r = parseInt(ci.value.slice(1, 3), 16);
    params.g = parseInt(ci.value.slice(3, 5), 16);
    params.b = parseInt(ci.value.slice(5, 7), 16);

    btn.disabled = true;
    btn.textContent = 'Đang dựng…';
    const res = await request('design.create', params);
    btn.disabled = false;
    btn.textContent = 'Thêm vào scene';
    log('← ' + JSON.stringify(res), res.ok ? 'ok' : 'err');
    if (res.ok) refreshStats();
  };
  card.appendChild(btn);
  grid.appendChild(card);
}

// ---- scene stats ----
async function refreshStats() {
  const res = await request('scene.getInfo');
  const el = document.getElementById('statsText');
  if (res.ok) {
    const r = res.result;
    el.textContent = `Scene: ${r.objects} object · ${r.selected} đang chọn · ${r.units} · ${r.renderer}`;
  } else {
    el.textContent = 'Scene: ' + (res.error ? res.error.code : 'lỗi');
  }
}

document.getElementById('refresh').onclick = refreshStats;
document.getElementById('clear').onclick = () => { document.getElementById('log').textContent = ''; };
document.querySelectorAll('button[data-method]').forEach(btn => {
  btn.onclick = async () => {
    const t0 = performance.now();
    const res = await request(btn.dataset.method);
    log(`← ${JSON.stringify(res)} (${Math.round(performance.now() - t0)}ms)`, res.ok ? 'ok' : 'err');
  };
});

if (webview) refreshStats();
</script>
</body>
</html>
